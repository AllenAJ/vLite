name: Build VLite.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets tagged builds attach VLite.exe to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test from source (tray, hotkey, overlay, dialogs)
        timeout-minutes: 3
        run: python vlite.py --selftest

      - name: Build VLite.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --onefile --noconsole --name VLite --icon assets/VLite.ico --add-data "assets/VLite.ico;assets" vlite.py

      - name: Self-test the built exe
        timeout-minutes: 3
        run: |
          $p = Start-Process dist\VLite.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:LOCALAPPDATA\VLite\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: VLite
          path: dist/VLite.exe

      # A push to main that raises VERSION in vlite.py publishes a new release (tag vX.Y.Z) with the exe.
      - name: Check for a new version
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $v = (Select-String -Path vlite.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $exists = git ls-remote --tags origin "refs/tags/v$v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: VLite ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: dist/VLite.exe
          generate_release_notes: true
